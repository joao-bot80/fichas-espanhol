<head>
<meta charset="utf-8">

<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1b1f24;--muted:#6a7380;--line:#e1e5ea;--accent:#2f6fed;--accent-t:#fff;--ok:#1f9d55;--bad:#d93f3f;--rm:#6b7280;--shadow:0 2px 10px rgba(0,0,0,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#1a1e24;--text:#e8ebef;--muted:#98a2b0;--line:#2b313a;--accent:#5b92ff;--accent-t:#0b1020;--ok:#35c07a;--bad:#ff6b6b;--rm:#8b94a3;--shadow:0 2px 10px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 16px calc(92px + env(safe-area-inset-bottom));min-height:100vh}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:18px;margin:22px 0 8px}
.muted{color:var(--muted)}.small{font-size:14px}
.counts{display:flex;gap:10px;margin-bottom:14px}
.pill{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.pill b{display:block;font-size:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 18px;min-height:190px;display:flex;flex-direction:column;justify-content:center}
.front{font-size:24px;font-weight:600;text-align:center;word-break:break-word}
.back{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);text-align:center}
.back .es{font-size:23px;font-weight:600;color:var(--accent);word-break:break-word}
.back .ex{margin-top:10px;color:var(--muted);font-style:italic}
.topic{font-size:13px;color:var(--muted);text-align:center;margin-bottom:8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;border-radius:14px;min-height:54px;padding:12px 16px;cursor:pointer;width:100%}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.rm{color:var(--rm)}
.btn.sm{min-height:44px;width:auto;padding:8px 14px;font-size:15px}
.row{display:flex;gap:10px;margin-top:14px}.row>*{flex:1}
.stack>*+*{margin-top:10px}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:0 0 14px}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.center{text-align:center;padding:30px 10px}
.center .big{font-size:46px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;padding:10px 4px 8px;min-height:58px;cursor:pointer}
nav button .i{display:block;font-size:22px;line-height:1.1}
nav button.on{color:var(--accent);font-weight:700}
input[type=text],textarea{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.stat{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.stat b{font-size:19px}
.li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.li>div{flex:1;min-width:0}.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:#222;color:#fff;border-radius:14px;padding:12px 16px;display:none;align-items:center;gap:14px;z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.35);max-width:92vw}
#toast.show{display:flex}
#toast button{background:none;border:0;color:#8fb4ff;font:inherit;font-weight:700;min-height:36px;padding:0 6px;cursor:pointer}
.kbd{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
@media(max-width:700px){.kbd{display:none}}
</style>
</head>

consiguió enseguida.", "topic": "vocabulário", "interval": 0, "due": "2026-11-04", "history": [], "new": true}, {"id": 216, "front_pt": "em breve / cedo", "back_es": "pronto", "example": "Nos vemos pronto. / Hoy me he levantado pronto.", "topic": "vocabulário", "interval": 0, "due": "2026-11-04", "history": [], "new": true}, {"id": 217, "front_pt": "pedir a alguém que faça algo (não \"pedir para\")", "back_es": "pedir a alguien que + subjuntivo", "example": "Le pedí a Luciana que consiguiera veinte testers.", "topic": "gramática", "interval": 0, "due": "2026-11-04", "history": [], "new": true}]}</script>
<script>
(function(){
"use strict";
var KEY="fichas_es_v1", LADDER=[1,3,7,14,30,60];
var seed=JSON.parse(document.getElementById("seed").textContent);
var memOnly=false, state=null, view="estudar", session=null, toastTimer=null, undoFn=null;

/* ---------- datas ---------- */
function pad(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return iso(new Date())}
function addDays(s,n){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]+n);return iso(d)}
function diffDays(a,b){var x=a.split("-"),y=b.split("-");return Math.round((new Date(+x[0],+x[1]-1,+x[2])-new Date(+y[0],+y[1]-1,+y[2]))/864e5)}

/* ---------- estado ---------- */
function normHist(h){
  return (h||[]).map(function(e){
    var c=e.correct; if(typeof c!=="boolean") c=(e.result==="correct");
    var o={date:e.date,correct:c}; return o;
  }).filter(function(e){return e.date});
}
function mkCard(c){
  return {id:c.id,front_pt:c.front_pt||"",back_es:c.back_es||"",example:c.example||"",topic:c.topic||"",
    interval:+c.interval||0,due:c.due||today(),history:normHist(c.history),removed:!!(c.removed||c.suspended),
    isNew:!!c.isNew||(c.new===true&&!(c.history&&c.history.length)),custom:!!c.custom,upd:+c.upd||0};
}
function seedState(){
  return {v:1,cards:seed.cards.map(mkCard),created:today()};
}
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){memOnly=true}
  var s=null;
  if(raw){try{s=JSON.parse(raw)}catch(e){s=null}}
  if(!s||!Array.isArray(s.cards)){s=seedState();state=s;save();return}
  var have={};s.cards.forEach(function(c){have[c.id]=1});
  var added=0;
  seed.cards.forEach(function(c){if(!have[c.id]){s.cards.push(mkCard(c));added++}});
  state=s; if(added)save();
}
function save(){
  if(memOnly)return;
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){memOnly=true;render()}
}
function byId(id){for(var i=0;i<state.cards.length;i++)if(state.cards[i].id===id)return state.cards[i]}
function active(){return state.cards.filter(function(c){return !c.removed})}

/* ---------- agendamento ---------- */
function nextInterval(iv){
  if(iv<=1)return 3;
  for(var i=0;i<LADDER.length;i++)if(LADDER[i]>iv)return LADDER[i];
  return 60;
}
function dueCards(){
  var t=today();
  return active().filter(function(c){return c.due<=t}).sort(function(a,b){return a.due<b.due?-1:a.due>b.due?1:a.id-b.id});
}
function upcoming(n){
  var t=today();
  return active().filter(function(c){return c.due>t}).sort(function(a,b){return a.due<b.due?-1:a.due>b.due?1:a.id-b.id}).slice(0,n);
}
function answer(card,ok,relearn){
  if(!relearn){
    card.history.push({date:today(),correct:ok});
    card.isNew=false;card.upd=Date.now();
    if(ok){card.interval=nextInterval(card.interval)}else{card.interval=1}
    card.due=addDays(today(),card.interval);
    save();
  }
}

/* ---------- sessão ---------- */
function startSession(cards){
  session={queue:cards.map(function(c){return {id:c.id,again:false}}),done:0,total:cards.length,revealed:false,ok:0,bad:0,removed:0};
  view="estudar";render();
}
function current(){return session&&session.queue.length?session.queue[0]:null}
function reveal(){if(session&&!session.revealed&&current()){session.revealed=true;render()}}
function respond(kind){
  var it=current();if(!it||!session.revealed)return;
  var c=byId(it.id);session.queue.shift();
  if(kind==="rm"){
    c.removed=true;c.upd=Date.now();save();session.removed++;
    session.revealed=false;
    showToast("Ficha removida do deck.",function(){c.removed=false;c.upd=Date.now();save();render()});
    render();return;
  }
  var ok=kind==="ok";
  answer(c,ok,it.again);
  if(!it.again){ if(ok)session.ok++;else session.bad++; session.done++ }
  if(!ok&&!it.again){
    var pos=Math.min(session.queue.length,4);
    session.queue.splice(pos,0,{id:c.id,again:true});
  }
  session.revealed=false;render();
}

/* ---------- toast ---------- */
function showToast(msg,undo){
  var t=document.getElementById("toast");
  document.getElementById("toastMsg").textContent=msg;
  undoFn=undo;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,6000);
}
function hideToast(){document.getElementById("toast").classList.remove("show");undoFn=null}
document.getElementById("toastUndo").addEventListener("click",function(){var f=undoFn;hideToast();if(f)f()});

/* ---------- estatísticas ---------- */
function stats(){
  var t=today(),studied=0,c7=0,n7=0,days={};
  state.cards.forEach(function(c){c.history.forEach(function(h){
    days[h.date]=1;
    if(h.date===t)studied++;
    var d=diffDays(t,h.date); if(d>=0&&d<7){n7++;if(h.correct)c7++}
  })});
  var streak=0,d=days[t]?t:addDays(t,-1);
  while(days[d]){streak++;d=addDays(d,-1)}
  return {total:active().length,removed:state.cards.length-active().length,due:dueCards().length,studied:studied,streak:streak,acc:n7?Math.round(100*c7/n7):null,n7:n7};
}

/* ---------- util ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function $(id){return document.getElementById(id)}

/* ---------- telas ---------- */
function render(){
  renderNav();
  var el=$("app");
  if(view==="estudar")el.innerHTML=vEstudar();
  else if(view==="stats")el.innerHTML=vStats();
  else el.innerHTML=vAjustes();
  bind();
}
function renderNav(){
  var items=[["estudar","📖","Estudar"],["stats","📊","Estatísticas"],["ajustes","⚙️","Ajustes"]];
  $("nav").innerHTML=items.map(function(i){return '<button data-nav="'+i[0]+'" class="'+(view===i[0]?"on":"")+'"><span class="i">'+i[1]+'</span>'+i[2]+'</button>'}).join("");
  Array.prototype.forEach.call($("nav").querySelectorAll("button"),function(b){b.onclick=function(){view=b.getAttribute("data-nav");render()}});
}
function warn(){return memOnly?'<p class="small" style="color:var(--bad)">⚠️ Este navegador não permite salvar dados (modo privado?). O progresso se perde ao fechar. Use Exportar nos Ajustes.</p>':""}

function vEstudar(){
  var s=stats(),h='<h1>Estudar hoje</h1>'+warn();
  var it=current();
  if(session&&it){
    var c=byId(it.id);
    h+='<div class="progress"><i style="width:'+Math.round(100*session.done/Math.max(1,session.total))+'%"></i></div>';
    h+='<div class="small muted" style="margin-bottom:8px">'+'Faltam <b>'+session.queue.length+'</b> de '+session.total+' · '+session.done+' respondidas'+(session.removed?' · '+session.removed+' removidas':'')+(it.again?' · <b>revisão do erro</b>':'')+'</div>';
    h+='<div class="card">'+(c.topic?'<div class="topic">'+esc(c.topic)+'</div>':'')+'<div class="front">'+esc(c.front_pt)+'</div>';
    if(session.revealed){
      h+='<div class="back"><div class="es">'+esc(c.back_es)+'</div>'+(c.example?'<div class="ex">'+esc(c.example)+'</div>':'')+'</div>';
    }
    h+='</div>';
    if(!session.revealed){
      h+='<div class="row"><button class="btn primary" id="bReveal">Mostrar resposta</button></div>';
    }else{
      h+='<div class="row"><button class="btn bad" id="bBad">Errei</button><button class="btn ok" id="bOk">Acertei</button></div>';
      h+='<div class="row"><button class="btn rm" id="bRm">Remover do deck</button></div>';
    }
    h+='<div class="kbd">Espaço/Enter: mostrar · → acertei · ← errei · Backspace/R: remover</div>';
    h+='<div class="row"><button class="btn sm" id="bEnd">Encerrar sessão</button></div>';
    return h;
  }
  if(session&&session.total>0){
    h+='<div class="center"><div class="big">🎉</div><h2>Sessão concluída</h2><p>Acertos: <b>'+session.ok+'</b> · Erros: <b>'+session.bad+'</b>'+(session.removed?' · Removidas: <b>'+session.removed+'</b>':'')+'</p></div>';
    session=null;
  }
  h+='<div class="counts"><div class="pill"><b>'+s.due+'</b><span class="small muted">para hoje</span></div><div class="pill"><b>'+s.total+'</b><span class="small muted">no deck</span></div></div>';
  if(s.due>0){
    h+='<button class="btn primary" id="bStart">Começar ('+s.due+' fichas)</button>';
  }else{
    h+='<div class="center"><div class="big">✅</div><p><b>Nada para hoje.</b><br><span class="muted">Volte amanhã ou estude mais agora.</span></p></div>';
    var up=upcoming(10);
    h+=up.length?'<button class="btn primary" id="bMore">Estudar mais ('+up.length+' próximas)</button>':'<p class="muted center">Não há mais fichas no deck.</p>';
  }
  return h;
}

function vStats(){
  var s=stats();
  return '<h1>Estatísticas</h1>'+warn()+
   '<div class="stat"><span>Total de fichas</span><b>'+s.total+'</b></div>'+
   '<div class="stat"><span>Para hoje</span><b>'+s.due+'</b></div>'+
   '<div class="stat"><span>Respostas hoje</span><b>'+s.studied+'</b></div>'+
   '<div class="stat"><span>Sequência de dias</span><b>'+s.streak+(s.streak===1?' dia':' dias')+'</b></div>'+
   '<div class="stat"><span>Acertos (últimos 7 dias)</span><b>'+(s.acc===null?'—':s.acc+'%')+'</b></div>'+
   '<p class="small muted">Baseado em '+s.n7+' respostas dos últimos 7 dias. Fichas removidas: '+s.removed+'.</p>';
}

function vAjustes(){
  var rem=state.cards.filter(function(c){return c.removed});
  var h='<h1>Ajustes</h1>'+warn();
  h+='<h2>Adicionar ficha</h2><div>'+
    '<label for="nF">Frente (português)</label><input type="text" id="nF" autocomplete="off">'+
    '<label for="nB">Resposta (espanhol da Espanha)</label><input type="text" id="nB" autocomplete="off">'+
    '<label for="nE">Exemplo (opcional)</label><input type="text" id="nE" autocomplete="off">'+
    '<div class="row"><button class="btn primary" id="bAdd">Adicionar</button></div></div>';
  h+='<h2>Backup do progresso</h2><div class="stack">'+
    '<button class="btn" id="bExp">Exportar progresso</button>'+
    '<textarea id="ioText" placeholder="O JSON exportado aparece aqui. Para importar, cole o JSON aqui." spellcheck="false"></textarea>'+
    '<button class="btn" id="bCopy">Copiar texto</button>'+
    '<button class="btn" id="bImpTxt">Importar (texto colado)</button>'+
    '<label class="btn" style="display:block;text-align:center;line-height:30px" for="fImp">Importar arquivo JSON…</label>'+
    '<input type="file" id="fImp" accept=".json,application/json" style="display:none">'+
    '<p class="small muted" id="ioMsg">A importação junta com o que já está aqui: em cada ficha vale a versão alterada mais recentemente.</p></div>';
  h+='<h2>Removidas ('+rem.length+')</h2>';
  if(!rem.length)h+='<p class="muted small">Nenhuma ficha removida.</p>';
  rem.forEach(function(c){h+='<div class="li"><div><div class="t">'+esc(c.front_pt)+'</div><div class="small muted">'+esc(c.back_es)+'</div></div><button class="btn sm" data-restore="'+c.id+'">Restaurar</button></div>'});
  h+='<h2>Zerar tudo</h2><button class="btn rm" id="bReset">Apagar progresso e voltar ao deck original</button>';
  return h;
}

/* ---------- export/import ---------- */
function exportObj(){return {app:"fichas-espanhol",version:1,exported:new Date().toISOString(),cards:state.cards}}
function msg(t){var m=$("ioMsg");if(m)m.textContent=t}
function doExport(){
  var txt=JSON.stringify(exportObj(),null,1);
  $("ioText").value=txt;
  try{
    var blob=new Blob([txt],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="fichas-espanhol-"+today()+".json";document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
    msg("Arquivo gerado. Se o download não aparecer (iPhone), use “Copiar texto”.");
  }catch(e){msg("Não consegui baixar o arquivo. Use “Copiar texto”.")}
}
function doCopy(){
  var ta=$("ioText");if(!ta.value)ta.value=JSON.stringify(exportObj(),null,1);
  function fallback(){ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);var ok=false;try{ok=document.execCommand("copy")}catch(e){}msg(ok?"Copiado!":"Selecione o texto e copie manualmente.")}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(function(){msg("Copiado!")},fallback)}else fallback();
}
function doImport(text){
  var data;
  try{data=JSON.parse(text)}catch(e){msg("JSON inválido.");return}
  var list=Array.isArray(data)?data:(data&&Array.isArray(data.cards)?data.cards:null);
  if(!list){msg("Formato não reconhecido.");return}
  var upd=0,add=0,maxId=state.cards.reduce(function(m,c){return Math.max(m,c.id)},0);
  list.forEach(function(raw){
    if(!raw||raw.id==null||!raw.front_pt)return;
    var inc=mkCard(raw);
    if(raw.removed===undefined&&raw.suspended===undefined)inc.removed=false;
    var cur=byId(inc.id);
    if(!cur){state.cards.push(inc);add++;if(inc.id>maxId)maxId=inc.id;return}
    if(cur.front_pt!==inc.front_pt||cur.back_es!==inc.back_es){
      if(cur.front_pt===inc.front_pt&&cur.history.length>=inc.history.length)return;
      if(cur.front_pt!==inc.front_pt){inc.id=++maxId;inc.custom=true;state.cards.push(inc);add++;return}
    }
    if(inc.upd>cur.upd||(inc.upd===cur.upd&&inc.history.length>cur.history.length)){
      var i=state.cards.indexOf(cur);state.cards[i]=inc;upd++;
    }
  });
  save();session=null;render();
  setTimeout(function(){msg("Importado: "+add+" novas, "+upd+" atualizadas.")},0);
}

/* ---------- eventos ---------- */
function bind(){
  var b;
  if(b=$("bReveal"))b.onclick=reveal;
  if(b=$("bOk"))b.onclick=function(){respond("ok")};
  if(b=$("bBad"))b.onclick=function(){respond("bad")};
  if(b=$("bRm"))b.onclick=function(){respond("rm")};
  if(b=$("bEnd"))b.onclick=function(){session=null;render()};
  if(b=$("bStart"))b.onclick=function(){startSession(dueCards())};
  if(b=$("bMore"))b.onclick=function(){startSession(upcoming(10))};
  if(b=$("bAdd"))b.onclick=function(){
    var f=$("nF").value.trim(),e=$("nB").value.trim(),x=$("nE").value.trim();
    if(!f||!e){alert("Preencha a frente e a resposta.");return}
    var id=state.cards.reduce(function(m,c){return Math.max(m,c.id)},0)+1;
    state.cards.push({id:id,front_pt:f,back_es:e,example:x,topic:"",interval:0,due:today(),history:[],removed:false,isNew:true,custom:true,upd:Date.now()});
    save();render();showToast("Ficha adicionada (para hoje).",null);
  };
  if(b=$("bExp"))b.onclick=doExport;
  if(b=$("bCopy"))b.onclick=doCopy;
  if(b=$("bImpTxt"))b.onclick=function(){var t=$("ioText").value.trim();if(!t){msg("Cole o JSON na caixa acima.");return}doImport(t)};
  if(b=$("fImp"))b.onchange=function(){
    var f=b.files&&b.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(){doImport(String(r.result))};r.readAsText(f);
  };
  if(b=$("bReset"))b.onclick=function(){
    if(confirm("Apagar TODO o progresso e voltar ao deck original? Exporte antes se quiser guardar.")){
      state=seedState();save();session=null;view="estudar";render();
    }
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-restore]"),function(x){
    x.onclick=function(){var c=byId(+x.getAttribute("data-restore"));c.removed=false;c.upd=Date.now();save();render()};
  });
}
document.addEventListener("keydown",function(e){
  var t=e.target&&e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA"||e.ctrlKey||e.metaKey||e.altKey)return;
  if(view!=="estudar"||!current())return;
  var k=e.key;
  if(!session.revealed){
    if(k===" "||k==="Enter"){e.preventDefault();reveal()}
  }else{
    if(k==="ArrowRight"){e.preventDefault();respond("ok")}
    else if(k==="ArrowLeft"){e.preventDefault();respond("bad")}
    else if(k==="Backspace"||k==="r"||k==="R"){e.preventDefault();respond("rm")}
  }
});

window.__fichas={get state(){return state},KEY:KEY,nextInterval:nextInterval,dueCards:dueCards,stats:stats,startSession:startSession,respond:respond,reveal:reveal,doImport:doImport,render:render,get session(){return session}};
load();render();
})();
</script>
